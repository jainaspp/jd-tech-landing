      e.preventDefault();
      const errEl = document.getElementById("staticrypt-error");
      errEl.classList.remove("is-visible");
      const password = normalizePassword(document.getElementById("staticrypt-password").value);
      // Always remember so hub → 01 → 02 does not re-prompt
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, true);
      if (!isSuccessful) {
        errEl.classList.add("is-visible");
        document.getElementById("staticrypt-password").focus();
        document.getElementById("staticrypt-password").select();
      }
    });
  </script>
</body>
</html>
