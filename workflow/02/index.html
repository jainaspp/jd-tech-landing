  <style>
    :root {

      --bg-card: #141414;
      --border: rgba(0, 229, 255, 0.22);
      --text: #ffffff;
      --muted: #a0a0a0;
      --accent: #00E5FF;
      --glow: 0 0 20px rgba(0, 229, 255, 0.35);
      --danger: #ff6b6b;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; height: 100%; }
    body.staticrypt-body {
      font-family: "Noto Sans HK", "Noto Sans TC", -apple-system, BlinkMacSystemFont,
        "PingFang TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(ellipse 120% 70% at 50% -15%, rgba(0, 229, 255, 0.1), transparent 55%),
        var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
      margin: 0;
    }
    .hidden { display: none !important; }
    .staticrypt-spinner-container {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .staticrypt-spinner {
      width: 2rem; height: 2rem;
      border: 0.25em solid rgba(0, 229, 255, 0.35);
      border-right-color: transparent;
      border-radius: 50%;
      animation: spinner-border 0.75s linear infinite;
    }
    @keyframes spinner-border { 100% { transform: rotate(360deg); } }
    .staticrypt-content {
      min-height: 100dvh;
      padding: 20px 16px calc(28px + var(--safe-bottom));
    }
    .wrap {
      max-width: 440px;
      margin: 0 auto;
      padding-top: 28px;
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      border: 1px solid rgba(0, 229, 255, 0.5);
      border-radius: 999px;
      padding: 4px 12px;
      margin-bottom: 14px;
      box-shadow: var(--glow);
    }
    .staticrypt-form {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px 22px 24px;
      text-align: center;
    }
    .staticrypt-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.35;
    }
    .staticrypt-instructions {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.55;
      text-align: left;
    }
    .staticrypt-password-container {
      position: relative;
      background: #0f0f0f;
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 12px;
      margin: 0 0 14px;
    }
    .staticrypt-form input[type="password"],
    .staticrypt-form input[type="text"] {
      background: transparent;
      border: 0;
      color: var(--text);
      font-size: 16px;
      font-family: inherit;
      outline: 0;
      padding: 15px 44px 15px 14px;
      width: 100%;
    }
    .staticrypt-form input::placeholder { color: #666; }
    .staticrypt-toggle-password-visibility {
      cursor: pointer;
      height: 20px;
      opacity: 0.55;
      padding: 12px;
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      filter: invert(1);
    }
    .staticrypt-decrypt-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 52px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      border: none;
      cursor: pointer;
      color: #0A0A0A;
      background: var(--accent);
      box-shadow: 0 4px 24px rgba(0, 229, 255, 0.4);
    }
    .staticrypt-decrypt-button:active { transform: scale(0.98); }
    .staticrypt-error {
      display: none;
      margin-top: 14px;
      font-size: 0.85rem;
      color: var(--danger);
      text-align: left;
      line-height: 1.45;
    }
    .staticrypt-error.is-visible { display: block; }
    .staticrypt-footer-note {
      margin-top: 18px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.45;
    }
    .staticrypt-footer-note a {
      color: var(--accent);
      text-decoration: none;
    }
    .logout-link {
      display: inline-block;
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    label.staticrypt-remember { display: none !important; }
  </style>
</head>

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleIcon.src = imgSrcEyeOpened;
        toggleIcon.alt = templateToggleAltHide;
        toggleIcon.title = templateToggleAltHide;
      } else {
        passwordInput.type = "password";
        toggleIcon.src = imgSrcEyeClosed;
        toggleIcon.alt = templateToggleAltShow;
        toggleIcon.title = templateToggleAltShow;
      }
    });

    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const errEl = document.getElementById("staticrypt-error");
      errEl.classList.remove("is-visible");
      const password = normalizePassword(document.getElementById("staticrypt-password").value);
      // Always remember so hub → 01 → 02 does not re-prompt
      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, true);
      if (!isSuccessful) {
        errEl.classList.add("is-visible");
        document.getElementById("staticrypt-password").focus();
        document.getElementById("staticrypt-password").select();
      }
    });
  </script>
</body>
</html>
